[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ready-customer-support"
version = "1.0.0"
description = "AI-Ready Customer Support API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn==0.51.0",
    "prisma==0.15.0",
    "pwdlib==0.3.0",
    "PyJWT==2.13.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.1",
    "httpx==0.28.1",
    "ruff==0.11.0",
    "mypy==1.13.0",
    "pre-commit==4.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"